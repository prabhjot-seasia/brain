        - cidr: 10.11.57.128/25
          route_table: rtb-0eb534b06dfa25122
    api:
      certificate: arn:aws:acm:us-east-1:572232158477:certificate/c6ecb475-6178-41b1-ab6f-e45a99d643f6
      domain: cs.dls-test.com
