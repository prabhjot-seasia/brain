databaseChangeLog:
  - changeSet:
      id: BRAIN-013.01
      author: brain
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: generated_documents
                columnName: status
      changes:
        - addColumn:
            tableName: generated_documents
            columns:
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: COMPLETED
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: text

  - changeSet:
      id: BRAIN-013.02
      author: brain
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: generated_documents
            columnName: content_md
      changes:
        - dropNotNullConstraint:
            tableName: generated_documents
            columnName: content_md
            columnDataType: text
