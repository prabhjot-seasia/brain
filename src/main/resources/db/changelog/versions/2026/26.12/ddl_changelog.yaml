databaseChangeLog:
  - changeSet:
      id: BRAIN-012.01
      author: brain
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_token_usage_created_at
      changes:
        - createIndex:
            tableName: token_usage_records
            indexName: idx_token_usage_created_at
            columns:
              - column:
                  name: created_at
                  descending: true

